edition: 3.0.0
name: tax-law-upload-proxy
access: ${env('TAX_FC_ACCESS', 'default')}
resources:
  uploadProxy:
    component: fc3
    props:
      region: cn-beijing
      functionName: tax-law-upload-proxy
      description: Tax law POC - fixed Bailian upload metadata endpoints only
      runtime: nodejs20
      handler: index.handler
      code: ./code
      memorySize: 128
      cpu: 0.05
      timeout: 60
      internetAccess: true
      disableInjectCredentials: All
      instanceConcurrency: 1
      concurrencyConfig:
        reservedConcurrency: 2
      environmentVariables:
        API_KEY_SHA256: ${env('TAX_UPLOAD_KEY_SHA256')}
        ALLOWED_ORIGINS: https://allenruan92.github.io
      triggers:
        - triggerName: web-upload
          triggerType: http
          triggerConfig:
            # Application authentication is enforced in index.js before any upstream call.
            authType: anonymous
            disableURLInternet: false
            methods:
              - POST
              - OPTIONS
